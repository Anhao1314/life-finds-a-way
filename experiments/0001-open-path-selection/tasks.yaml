      RL-Sentinel 在固定 commit 上：含规则回测模块（backtest_engine.py、
      backtest_rules.py、consistency_check.py）与提交的研究数据集
      （data/datasets/*.csv）；README 与 PHASE_RECORD.md 记录了既有审计
      发现与规则定义。
    tools_and_resources: |
      本地克隆；Python 3.12+ 与仓库依赖已预装；数据集随仓库分发；
      无网络；无 GPU（本任务不涉及训练，只做离线回放分析）。
    permission_boundaries: "同 LF001；另：不修改 data/ 下数据集，分析产物写到独立输出目录。"
    independent_acceptance:
      method: |
        （待所有者确认——这是本任务被标记为 candidate 的原因。）
        拟议判据：1) 召回差距数字可由验收方用独立脚本从原始数据集重算，
        与交付报告一致；2) 每个被归类的漏报 run 都能从原始数据复现其
        "规则为何未触发"的证据链；3) 若有规则建议，须给出改动前后的
        召回/误报对比（同一数据、同一脚本）。
      hidden_reference: |
        无上游标准答案；PHASE_RECORD.md 中的既有审计发现可作交叉参考
        （执行前判断是否向 Agent 提供该文件，须在附录 B 冻结）。
      needs_baseline_reproduction_before_run: true
    b_prescribed_path: |
      步骤：
      1. 复算当前规则集在固定数据集上的召回/误报基线（与 README 数字对齐）；
      2. 对每个漏报 run 提取触发条件缺失的特征（时间窗、指标口径、阈值
         距离），聚类成失败类别；
      3. 检查规则实现与 PHASE_RECORD 中规则定义的口径一致性（已知历史
         风险：因子口径不一致）；
      4. 产出召回差距报告 + 每类的证据链 + （若有）规则调整建议及其
         回测对比；
      5. 所有数字可由独立脚本从 data/ 重算。
      验证步骤：第 5 步是验收前提；报告数字与独立重算一致。
    estimated_cost: "中-大；分析型任务，单次运行预计 < 350K tokens"
    failure_modes:
      - 报告数字无法独立重算（引用了未沉淀的中间状态）
      - 把"规则未触发"错误归因于数据问题（或反之），证据链断裂
      - 分析过拟合到 18 个 run 的小样本，建议不可泛化（如实标注即可）
    preparation_gaps: |
      1) 验收方式含主观成分，需所有者确认拟议判据或提供更客观判据，
         确认前不运行本任务；
      2) PHASE_RECORD.md 是否对 Agent 可见需在附录 B 冻结（可见会降低
         根因不确定性，不可见则更接近真实用户情境）；
      3) 若所有者认为判据无法客观化，应从本批次移出并在 amendments 记录
         （须发生在查看任何运行结果之前）。
