  - task_id: LF001
    title: "CliRunner + echo_via_pager 抛出 'I/O operation on closed file'"
    status: verified
    category: debug-root-cause
    source:
      repo: "https://github.com/pallets/click"
      base_commit: "cd9bdd96a9dcc8e4ecabd45b5c244dbc70034484"
      base_commit_note: "上游修复 PR #3533 合并提交 4df304c6 的第一父提交（修复前状态）"
      issue_url: "https://github.com/pallets/click/issues/3449"
      fix_pr_url: "https://github.com/pallets/click/pull/3533"
      fix_merge_commit: "4df304c658666f34a5ca4335ab0da15832f02f9e"
      verified_at: "2026-10-28"
    real_user_problem: |
      使用 click 编写的命令行程序在输出经过分页器（echo_via_pager，例如 --help
      的长输出）且运行在 CliRunner 测试环境中时，报错
      "ValueError: I/O operation on closed file"。该回归出现在 8.4 系列，
      已影响多个下游项目（issue 时间线中可见 dask、vulnscout 等项目的临时
      降级处理）。请查明根因并修复，使分页输出在 CliRunner 下恢复正常。
    starting_state: |
      pallets/click 仓库在固定 commit 上：分页输出路径与 CliRunner.isolation
      的流生命周期管理共存时的借用/关闭语义存在缺陷；仓库自带完整测试套件，
      该缺陷在既有套件中未被覆盖。
    tools_and_resources: |
      本地完整 git 克隆（固定 commit）；Python 环境与仓库开发依赖已预装；
      可运行 pytest 与项目测试套件；无网络访问。
    permission_boundaries: |
      仅允许修改本仓库工作副本内文件；禁止网络访问与依赖安装；
      禁止调用任何付费 API；禁止修改 tests/ 下既有测试的断言来让失败消失；
      禁止改动与本修复无关的文件。
    independent_acceptance:
      method: |
        1) 复现判据：在 base_commit 上，构造 issue 描述的场景（CliRunner 调用
           经 echo_via_pager 输出的命令），运行时报 "I/O operation on closed
           file"；修复后的运行不再报错且输出完整。
        2) 套件判据：仓库测试套件全部通过。
        3) 回归判据：验收方预先从上游修复 PR 移植的回归测试，在 base_commit
           上失败、在交付物上通过。
      hidden_reference: |
        Gold 参考（仅验收方）：上游 PR #3533 的 diff 与其新增/调整的测试。
        执行前义务：验收方需先确认该回归测试在 base_commit 上确实失败。
      needs_baseline_reproduction_before_run: true
    b_prescribed_path: |
      推荐路线：这是流生命周期管理问题——CliRunner 的 isolation 在退出时
      关闭了不属于它创建、而是借用的 stdout，下游再写即报错。
      步骤：
      1. 用 issue 场景构造最小复现脚本，确认报错栈指向 isolation 退出路径；
      2. 审读 CliRunner.isolation 的 enter/exit 顺序，区分"runner 创建的流"
         与"借用的外部流"；
      3. 修改退出逻辑：只关闭 runner 自建的流，对借用的流仅恢复引用不关闭；
      4. 按 isolation 的生命周期补一个回归测试（借用流在退出后仍可写）；
      5. 运行完整测试套件确认无回归。
      验证步骤：先跑复现脚本（修复前失败、修复后通过），再跑全套件。
    estimated_cost: "小-中；单次运行预计 < 200K tokens"
    failure_modes:
      - 误定位为 pager 子进程问题，去修分页器调用而非流生命周期
      - 改动面扩大到整个 isolation 逻辑，引入无关回归
      - 测试在未复现缺陷的环境上假绿（需先确认复现判据在 base 上成立）

  - task_id: LF002
    title: "fish shell 补全在 8.4.1 损坏（多行 help 改动的回归）"
    status: verified
    category: debug-root-cause
    source:
      repo: "https://github.com/pallets/click"
      base_commit: "bc36cd1a2b3bc18f401a98476154dbc5a2d212c9"
      base_commit_note: "上游修复 PR #3504 合并提交 c3535905 的第一父提交"
      issue_url: "https://github.com/pallets/click/issues/3502"
      fix_pr_url: "https://github.com/pallets/click/pull/3504"
      fix_merge_commit: "c3535905c77a29afc84861b29d3ad366ce5451bd"
      verified_at: "2026-10-28"
    real_user_problem: |
      升级到 click 8.4.1 后，fish shell 的命令补全损坏。此前版本生成的补全
      脚本工作正常；回归来自近期对多行 help 文本处理的一次改动。请查明根因
      并修复，使 fish 补全恢复，同时保持多行 help 文本的正确支持。
    starting_state: |
      pallets/click 在固定 commit 上：shell 补全模块的 fish 分支与多行
      help 字符串处理交互存在缺陷；补全脚本以快照/生成方式测试。
    tools_and_resources: "同 LF001（本地克隆、预装依赖、pytest、无网络）。"
    permission_boundaries: "同 LF001。"
    independent_acceptance:
      method: |
        1) 复现判据：在 base_commit 上生成 fish 补全脚本并断言其内容缺陷
           （验收方预先脚本化"损坏"的具体形态）；
        2) 修复判据：同一脚本对交付物生成的补全脚本断言通过，且多行 help
           文本用例保持正确；
        3) 套件判据：完整测试套件通过。
      hidden_reference: |
        Gold 参考（仅验收方）：上游 PR #3504 的 diff 与测试。
        执行前义务：确认"损坏形态"断言在 base_commit 上成立。
      needs_baseline_reproduction_before_run: true
    b_prescribed_path: |
      推荐路线：对比 8.3.x 与当前版本的 fish 补全生成输出，定位多行 help
      改动引入的转义/换行缺陷。
      步骤：
      1. 构造含多行 help 的命令，生成 fish 补全脚本，与 8.3.x 输出做差异对比；
      2. 定位补全模块中处理 help 文本换行/转义的改动点；
      3. 修复该处理逻辑，使生成的补全脚本语法有效；
      4. 补两组回归测试：多行 help 的 fish 补全快照、普通 help 不受影响；
      5. 运行完整套件。
      验证步骤：补全脚本可用 fish --no-execute 做语法校验（本地）。
    estimated_cost: "小；单次运行预计 < 150K tokens"
    failure_modes:
      - 只修 fish 而破坏多行 help 在其他 shell 的呈现
      - 快照测试对 fish 版本敏感，环境差异导致假红/假绿
      - 用宽泛的 try/except 掩盖生成缺陷

  - task_id: LF003
    title: "CliRunner 借用 stdout 的 fd 暴露破坏下游 pytest 套件（8.3.x 回归）"
    status: verified
    category: debug-root-cause
    source:
      repo: "https://github.com/pallets/click"
      base_commit: "ba745ac64037b7d4cdd0abce10446c0a2861935f"
      base_commit_note: "上游修复 PR #3391 合并提交 d959898d 的第一父提交"
      issue_url: "https://github.com/pallets/click/issues/3384"
      fix_pr_url: "https://github.com/pallets/click/pull/3391"
      fix_merge_commit: "d959898db264aaf07e70ad4eafa254286f9a5185"
      verified_at: "2026-10-28"
    real_user_problem: |
      click 8.3.3 在 pytest 下破坏了大量下游项目的测试套件：当 stdout 的
      文件描述符被复制（duplicated）时，CliRunner 的行为与真实终端不一致，
      导致依赖终端 fd 语义的测试失败。请查明 8.3.3 中相关改动的问题并修复，
      恢复下游兼容性，同时不放弃 8.3 系列引入的合理能力。
    starting_state: |
      pallets/click 在固定 commit 上：CliRunner 对 stdout fileno 的暴露策略
      与流复制场景存在冲突；issue 时间线含多个下游项目受影响的证据。
    tools_and_resources: "同 LF001。"
    permission_boundaries: "同 LF001。"
    independent_acceptance:
      method: |
        1) 复现判据：验收方预制的"fd 复制 + CliRunner"场景测试在 base_commit
           上失败；
        2) 修复判据：同一场景在交付物上通过，且 CliRunner 的常规捕获语义
           用例不回归；
        3) 套件判据：完整测试套件通过。
      hidden_reference: |
        Gold 参考（仅验收方）：上游 PR #3391 的 diff（引入显式 capture 模式并
        调整默认 fileno 暴露）与其测试。
      needs_baseline_reproduction_before_run: true
    b_prescribed_path: |
      推荐路线：审查 8.3.2→8.3.3 中 CliRunner 流暴露策略的改动，恢复默认
      借用语义，把 fd 级捕获改为显式可选能力。
      步骤：
      1. 写出"fd 复制场景"的最小失败用例；
      2. 用 git log 定位 8.3.3 相关改动与动机；
      3. 设计兼容方案：默认行为回退到借用语义，新增显式参数提供 fd 暴露；
      4. 实现并为两种模式分别补测试；
      5. 运行完整套件。
      验证步骤：最小用例与下游兼容场景均在交付物上通过。
    estimated_cost: "中；单次运行预计 < 250K tokens（涉及 API 兼容性权衡）"
    failure_modes:
      - 在"默认回退"与"保留新能力"之间反复摇摆，产生大量无关 diff
      - 只修 pytest 场景而不处理 fd 语义的一般情况
      - 引入 CLI 行为回归（输出捕获与终端行为混淆）

  - task_id: LF004
    title: "Session 请求自 2.26.0 起慢约 70%（代理环境解析的重复开销）"
    status: verified
    category: perf-structure-workflow
    source:
      repo: "https://github.com/psf/requests"
      base_commit: "b0829a869081c2a6180db2cdc41a5676922becd0"
      base_commit_note: "上游修复 PR #5894 合并提交 77d1e9aa 的第一父提交"
      issue_url: "https://github.com/psf/requests/issues/5891"
      fix_pr_url: "https://github.com/psf/requests/pull/5894"
      fix_merge_commit: "77d1e9aa3e000b40fdf93cfc355e1fe7cc52b6ac"
      verified_at: "2026-10-28"
    real_user_problem: |
      用户实测：从 requests 2.25.x 升级到 2.26.0 后，使用 Session 发送请求
      的耗时增加约 70%。请定位性能回归的根因并修复，要求不改变代理相关的
      对外语义（对环境变量与显式配置的处理结果保持一致）。
    starting_state: |
      psf/requests 在固定 commit 上：每个请求都会重新执行代理环境解析
      （should_bypass_proxies 相关路径），在无代理环境中构成重复开销；
      仓库自带测试套件与部分基准脚本。
    tools_and_resources: |
      本地克隆与预装依赖；可运行 pytest；可运行 cProfile 等标准库分析工具；
      无网络访问（性能测量以本地函数级基准为准，不做真实网络请求）。
    permission_boundaries: "同 LF001；另：禁止发起任何真实网络请求（含 localhost 之外的探测）。"
    independent_acceptance:
      method: |
        1) 基准判据：验收方预登记的函数级基准脚本（对 rebuild_proxies 路径
           的调用计数与本地计时），交付物的调用次数显著下降且计时改善；
           具体阈值在执行前于验收脚本中冻结；
        2) 语义判据：代理相关既有测试全部通过（含显式 proxies 配置、
           NO_PROXY 环境变量组合用例）；
        3) 套件判据：完整测试套件通过。
      hidden_reference: |
        Gold 参考（仅验收方）：上游 PR #5894 的 diff（单文件）。
        执行前义务：确认基准脚本能区分 base_commit 与上游修复后的调用计数。
      needs_baseline_reproduction_before_run: true
    b_prescribed_path: |
      推荐路线：性能回归的根因在请求准备路径上重复执行的代理环境解析。
      步骤：
      1. 用 cProfile 对比"显式配置 proxies 的 Session"与"空 Session"单请求
         的热点，定位重复解析点；
      2. 审读 rebuild_proxies 与 merge 设置的调用关系，确认哪些调用在
         proxies 已显式给出时是多余的；
      3. 修改：当 Session 已显式配置 proxies 时跳过环境代理解析；
      4. 补充语义测试：显式 proxies、环境变量、两者混合的用例行为不变；
      5. 用基准脚本验证调用计数下降，运行完整套件。
      验证步骤：基准 + 代理语义测试 + 完整套件三者全绿。
    estimated_cost: "中；单次运行预计 < 250K tokens"
    failure_modes:
      - 改变代理合并语义（显式配置与环境变量的优先顺序），功能测试红
      - 缓存了随请求变化的中间态，引入正确性回归
      - 验收基准抖动导致误判（故判据以调用计数为主、计时为辅）

  - task_id: LF005
    title: "双宽字符（中文/日文）换行时文本块丢失"
    status: verified
    category: debug-root-cause
    source:
      repo: "https://github.com/Textualize/rich"
      base_commit: "b32e42bda00c6275d4e18dcbe298268094359549"
      base_commit_note: "上游修复 PR #3180 合并提交 59b1aca6 的第一父提交"
      issue_url: "https://github.com/Textualize/rich/issues/3176"
      fix_pr_url: "https://github.com/Textualize/rich/pull/3180"
      fix_merge_commit: "59b1aca63bf9ec69ada93af960d8b2a7bd920477"
      verified_at: "2026-10-28"
    real_user_problem: |
      用 rich 输出包含中文/日文等双宽字符的段落时，部分文本在换行处直接
      丢失（字符消失而非错位）。对以 CJK 文本为主要内容的用户是高频问题。
      请查明换行/分割逻辑的根因并修复，保证任何显示宽度下文本完整。
    starting_state: |
      Textualize/rich 在固定 commit 上：文本换行按单元格宽度切分时，对
      双宽字符的边界假设有缺陷；仓库带快照式测试设施。
    tools_and_resources: "同 LF001（本地克隆、预装依赖、pytest、无网络）。"
    permission_boundaries: "同 LF001。"
    independent_acceptance:
      method: |
        1) 复现判据：验收方预制的双宽字符段落测试（在多档显示宽度下断言
           "输出重拼后与输入文本内容一致"）在 base_commit 上失败；
        2) 修复判据：同一测试在交付物上通过，且既有宽字符/emoji 用例不回归；
        3) 套件判据：完整测试套件通过。
      hidden_reference: |
        Gold 参考（仅验收方）：上游 PR #3180 的 diff（6 文件）与其测试样例。
      needs_baseline_reproduction_before_run: true
    b_prescribed_path: |
      推荐路线：分割逻辑在单元格边界上对双宽字符做了错误假设，导致字符
      被丢弃；修复应保证切分永远不吞字符。
      步骤：
      1. 用多档宽度的 CJK 段落复现丢字现象，记录丢字位置规律；
      2. 审读换行/单元格分割代码，定位宽度取整或边界判断的缺陷；
      3. 修复分割逻辑：边界不足一个完整字符时回退到安全位置；
      4. 补测试：多档宽度 × 中/日文样例，断言内容完整；
      5. 运行完整套件，重点检查既有 emoji/组合字符用例。
      验证步骤：内容完整性测试 + 完整套件。
    estimated_cost: "中；单次运行预计 < 250K tokens"
    failure_modes:
      - 只在特定宽度档位修好（启发式补丁），换宽度又丢字
      - 引入宽字符计数回归（emoji、组合字符被错误计宽）
      - 为通过测试放宽断言而非修复根因

  - task_id: LF006
    title: "Markdown 表格单元格内的链接与内联样式渲染异常"
