  - task_id: LF008
    title: "ClaimLedger gateway：移除 _render 的 sys.argv 劫持，apply 改隐式指纹绑定"
    status: verified
    category: perf-structure-workflow
    source:
      repo: "https://github.com/Anhao1314/ClaimLedger"
      base_commit: "64310835bfd977b50ccdfb2795d563a2da73532b"
      base_commit_note: "核查当日 main HEAD；开放 issue #10 引用 docs/refactor-design.md §4-P1"
      issue_url: "https://github.com/Anhao1314/ClaimLedger/issues/10"
      design_doc: "https://github.com/Anhao1314/ClaimLedger/blob/main/docs/refactor-design.md"
      verified_at: "2026-10-28"
    real_user_problem: |
      gateway 的 apply 流程要求 Agent 在协议层"搬运哈希"（多层包装契约），
      协议重且易错；同时渲染器内部逻辑通过劫持 sys.argv 被调用，无法作为
      普通函数使用。目标：apply 改为隐式指纹绑定——sync 把当次指纹写入
      状态，apply 时若源指纹或 pending 集合已变化即拒绝并提示重新 sync；
      _render 的 sys.argv 劫持替换为可直接 import 的函数调用。
      （来自作者开放 issue #10 与仓库内设计文档 §4-P1 第 4 条。）
    starting_state: |
      ClaimLedger 在固定 commit 上：chat_distiller/gateway/core.py 存在
      _load_apply_wrapper 的多层包装与 _render 的 sys.argv 劫持；设计文档
      标注行号约 48-58 与 357（执行前需按实际代码复核位置）；仓库带测试
      套件（289 项量级）。
    tools_and_resources: |
      本地克隆与预装依赖（零第三方运行时依赖，stdlib 为主）；可运行
      python -m unittest discover -s tests；无网络。
    permission_boundaries: |
      同 LF001；另：不修改 docs/refactor-design.md 与 CHANGELOG 中的历史
      记录；不删除既有测试来掩盖失败。
    independent_acceptance:
      method: |
        1) 行为判据（预冻结）：sync → 不变更 → apply 成功；sync → 修改
           pending 集合 → apply 被拒绝且错误信息指引重新 sync；
        2) 结构判据：渲染器内部逻辑可被测试直接 import 调用，调用过程
           不再读写 sys.argv（用 sys.argv 快照断言）；
        3) 套件判据：完整测试套件通过；公开 API（MemoryStore 签名、
           recovery packet schema_version 2）不破坏。
      hidden_reference: |
        Gold 参考（仅验收方）：设计文档 §4-P1 第 4 条的目标行为描述。
        本任务无上游"标准答案"提交；验收判据即上述行为断言。
      needs_baseline_reproduction_before_run: true
    b_prescribed_path: |
      （本方案取自作者已在仓库公开发布的设计文档 §4-P1，代表作者本人
      在实验前写好的实现方案。）
      步骤：
      1. 将 _render 的渲染内部逻辑导出为可 import 的函数 API，main() 只留
         参数解析薄壳，删除 sys.argv 劫持；
      2. 删除 _load_apply_wrapper 的多层包装，apply 直接接受 distill JSON；
      3. sync 时把当次源指纹与 pending 集合写入 state；apply 时与 state
         比对，不一致即拒绝（错误信息指引重新 sync）；
      4. 为"隐式绑定"补测试：一致通过、指纹漂移拒绝、pending 漂移拒绝；
      5. 运行完整套件，确认 MemoryStore 公开 API 与 packet schema 未变。
      验证步骤：行为判据三项 + 完整套件。
    estimated_cost: "中；单次运行预计 < 300K tokens（涉及并发与状态语义）"
    failure_modes:
      - 隐式绑定把"过严拒绝"实现成"过宽放行"，安全语义倒退
      - 渲染 API 导出时破坏既有 CLI 入口的参数行为
      - 忽略双检锁与并发写场景，测试单线程全绿但语义有竞态

